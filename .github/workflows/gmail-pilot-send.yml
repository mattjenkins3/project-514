name: Gmail single pilot send
on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: Send one synthetic pilot email to the configured recipient
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency: project514-single-gmail-pilot-send
jobs:
  deliver:
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1' && inputs.confirmed
    runs-on: ubuntu-latest
    environment: pilot
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Send one synthetic pilot email
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ vars.GMAIL_SENDER || secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ vars.GMAIL_RECIPIENT || secrets.GMAIL_RECIPIENT }}
        run: |
          python - <<'PY'
          import os
          from html import escape

          from project514.engine import baseline
          from project514.gmail import GmailEmail, GmailError
          from project514.gmail_preflight import load_config
          from project514.nutrition import target
          from project514.render import Message, workout

          session = baseline(1, 2)
          nutrition = target(session.kind)
          subject = "[Pilot test] Project 5.14 | W01 D03 | Climbing technique"
          sections = [
              ("Delivery test", "This sample uses synthetic data. No training or check-in is requested."),
              ("Sample session", workout(session, 1)),
              ("Sample fueling", f"Provisional: {nutrition.kcal:,} kcal, {nutrition.protein_g} g protein, "
               f"{nutrition.carbs_g} g carbs, {nutrition.fat_g} g fat."),
              ("Technique cue", "Practice quiet feet and relaxed grip."),
          ]
          plain = subject + "\n\n" + "\n\n".join(f"{title}\n{body}" for title, body in sections)
          html = f'<h1>{escape(subject)}</h1>' + ''.join(
              f'<h2>{escape(title)}</h2><p>{escape(body)}</p>' for title, body in sections
          )
          try:
              GmailEmail(load_config(os.environ)).deliver(
                  f"pilot-{os.environ['GITHUB_RUN_ID']}", Message(subject, plain, html),
              )
          except (ValueError, GmailError) as exc:
              raise SystemExit(f"Single pilot send stopped: {exc}") from None
          print("Gmail accepted the single pilot email.")
          PY
